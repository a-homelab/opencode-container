[project]
name = "agents-toolkit"
version = "0.0.0"
description = "Shared Python environment for scripts coding agents write"
requires-python = ">=3.12"
dependencies = [
    "requests",
    "httpx",
    "tenacity",
    "pydantic",
    "pyyaml",
    "pandas",
    "beautifulsoup4",
    "lxml",
    "python-dateutil",
    "rich",
    "jinja2",
    "python-dotenv",
]

[dependency-groups]
dev = ["ruff", "pytest"]

[tool.uv]
package = false
